<!doctype html>
<html lang="en">
    <head>
        <script>
            function connectOpenActionSocket(
                inPort,
                inPropertyInspectorUUID,
                inRegisterEvent,
                inInfo,
                inActionInfo,
            ) {
                const websocket = new WebSocket("ws://localhost:" + inPort);
                inActionInfo = JSON.parse(inActionInfo);
                const settings = inActionInfo.payload?.settings ?? {};

                const actionIdEl = document.getElementById("actionId");
                actionIdEl.value = settings.actionId ?? "";

                const paramsEl = document.getElementById("params");
                paramsEl.value = settings.params ?? "";

                const longPressActionIdEl =
                    document.getElementById("longPressActionId");
                longPressActionIdEl.value = settings.longPressActionId ?? "";

                const longPressParamsEl =
                    document.getElementById("longPressParams");
                longPressParamsEl.value = settings.longPressParams ?? "";

                websocket.onopen = () => {
                    websocket.send(
                        JSON.stringify({
                            event: inRegisterEvent,
                            uuid: inPropertyInspectorUUID,
                        }),
                    );
                };

                websocket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.event === "didReceiveSettings") {
                        actionIdEl.value = data.payload?.settings?.actionId ?? "";
                        paramsEl.value = data.payload?.settings?.params ?? "";
                        longPressActionIdEl.value =
                            data.payload?.settings?.longPressActionId ?? "";
                        longPressParamsEl.value =
                            data.payload?.settings?.longPressParams ?? "";
                    }
                };

                const sendSettings = () => {
                    websocket.send(
                        JSON.stringify({
                            event: "setSettings",
                            context: inActionInfo.context,
                            payload: {
                                actionId: actionIdEl.value,
                                params: paramsEl.value,
                                longPressActionId: longPressActionIdEl.value,
                                longPressParams: longPressParamsEl.value,
                            },
                        }),
                    );
                };

                actionIdEl.addEventListener("input", sendSettings);
                paramsEl.addEventListener("input", sendSettings);
                longPressActionIdEl.addEventListener("input", sendSettings);
                longPressParamsEl.addEventListener("input", sendSettings);
            }

            const connectElgatoStreamDeckSocket = connectOpenActionSocket;
        </script>

        <style>
            * {
                font-family: system-ui, sans-serif;
                font-size: 16px;
                color: oklch(92.2% 0 0);
            }
            body {
                margin: 16px;
                background-color: oklch(26.9% 0 0);
            }
            label {
                margin-right: 4px;
            }
            input {
                margin: 4px;
                padding: 4px;
                background-color: oklch(37.1% 0 0);
                border: 1px solid oklch(43.9% 0 0);
                border-radius: 8px;
                width: calc(100% - 16px);
            }
        </style>
    </head>

    <body>
        <div>
            <label for="actionId">Action ID</label>
            <input type="text" id="actionId" placeholder="e.g. entry.next_esm_step" />
        </div>
        <div>
            <label for="params">Parameters</label>
            <input type="text" id="params" placeholder="e.g. number=5" />
        </div>
        <div>
            <label for="longPressActionId">Long Press Action ID</label>
            <input
                type="text"
                id="longPressActionId"
                placeholder="empty: same as Action ID"
            />
        </div>
        <div>
            <label for="longPressParams">Long Press Parameters</label>
            <input
                type="text"
                id="longPressParams"
                placeholder="e.g. number=5"
            />
        </div>
    </body>
</html>
